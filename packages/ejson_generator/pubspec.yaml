name: ejson_generator
description: >-
  EJSON serialization.

  BSON is a binary format used to store JSON-like documents efficiently.
  EJSON extends JSON defining how all BSON types should be represented in JSON.

topics:
  - ejson
  - bson
  - json
  - build-runner
  - codegen

version: 0.4.1
repository: https://github.com/realm/realm-dart/ejson/packages/ejson_generator

environment:
  sdk: ^3.6.0

dependencies:
  analyzer: ^6.4.0
  build: 2.4.0
  ejson_analyzer:
    path: ../ejson_analyzer
  source_gen: ^1.3.2

dev_dependencies:
  build_runner: 2.4.13
  build_test: ^2.2.2
  dart_style: ^2.0.0
  ejson:
    path: ../ejson
  ejson_annotation:
    path: ../ejson_annotation
  lints: ^5.1.1
  meta: ^1.15.0
  test: ^1.25.9
  pub_semver: ^2.2.0
